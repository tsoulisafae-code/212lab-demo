# Copy ONLY into .github/workflows/pages.yml of the separate PUBLIC demo repository.
# No push trigger: publication must be started manually after reviewing site/.
name: Publier la démonstration 212LAB
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publier les fichiers statiques approuvés
        id: deployment
        uses: actions/deploy-pages@v4
